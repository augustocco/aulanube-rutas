# AulaNube Rutas en el clúster K3s de la Unidad 1 (OCI, sa-bogota-1).
# Dos despliegues con los mismos datos de demostración para comparar en vivo:
#   https://rutas.149-130-191-139.sslip.io     → iteración 3 (ruta por urgencia, caché, escritura por lotes)
#   https://rutas-v1.149-130-191-139.sslip.io  → iteración 1 (orden alfabético, N+1, OFFSET)
# Cada pod genera su propia base SQLite de demostración al arrancar; en producción la base
# sería la del LMS, compartida, y la caché sería Redis.
apiVersion: v1
kind: Namespace
metadata: { name: aulanube-rutas }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rutas-v3, namespace: aulanube-rutas }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: rutas, version: v3 } }
  template:
    metadata: { labels: { app: rutas, version: v3 } }
    spec:
      containers:
        - name: rutas
          image: aulanube/rutas:v1
          imagePullPolicy: Never
          env: [{ name: VERSION, value: v3 }]
          ports: [{ containerPort: 7400 }]
          readinessProbe: { httpGet: { path: /api/estado, port: 7400 }, periodSeconds: 5, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 96Mi }, limits: { memory: 384Mi } }
          volumeMounts: [{ name: datos, mountPath: /datos }]
      volumes: [{ name: datos, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rutas-v1, namespace: aulanube-rutas }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: rutas, version: v1 } }
  template:
    metadata: { labels: { app: rutas, version: v1 } }
    spec:
      containers:
        - name: rutas
          image: aulanube/rutas:v1
          imagePullPolicy: Never
          env: [{ name: VERSION, value: v1 }]
          ports: [{ containerPort: 7400 }]
          readinessProbe: { httpGet: { path: /api/estado, port: 7400 }, periodSeconds: 5, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 96Mi }, limits: { memory: 384Mi } }
          volumeMounts: [{ name: datos, mountPath: /datos }]
      volumes: [{ name: datos, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: rutas-v3, namespace: aulanube-rutas }
spec: { selector: { app: rutas, version: v3 }, ports: [{ port: 80, targetPort: 7400 }] }
---
apiVersion: v1
kind: Service
metadata: { name: rutas-v1, namespace: aulanube-rutas }
spec: { selector: { app: rutas, version: v1 }, ports: [{ port: 80, targetPort: 7400 }] }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: redirigir-https, namespace: aulanube-rutas }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rutas
  namespace: aulanube-rutas
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: rutas.149-130-191-139.sslip.io
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: rutas-v3, port: { number: 80 } } } }] }
    - host: rutas-v1.149-130-191-139.sslip.io
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: rutas-v1, port: { number: 80 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rutas-http
  namespace: aulanube-rutas
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: aulanube-rutas-redirigir-https@kubernetescrd
spec:
  rules:
    - host: rutas.149-130-191-139.sslip.io
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: rutas-v3, port: { number: 80 } } } }] }
    - host: rutas-v1.149-130-191-139.sslip.io
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: rutas-v1, port: { number: 80 } } } }] }
